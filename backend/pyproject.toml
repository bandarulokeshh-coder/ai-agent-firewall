[project]
name = "firewall-backend"
version = "0.1.0"
description = "AI Agent Firewall Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "ollama>=0.3.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.19.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]